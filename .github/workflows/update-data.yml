name: データ自動更新

on:
  schedule:
    - cron: "17 0 1 * *"   # 毎月1日 9:17（日本時間）
  workflow_dispatch:        # Actions画面から手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install requests beautifulsoup4

      - name: スクレイピング実行
        run: python3 scraper.py

      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data.json; then
            echo "データに変更はありません"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "データ自動更新: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push
