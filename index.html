<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>札幌業者ナビ</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="業者ナビ">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { overscroll-behavior: none; background:#f1f5f9; }
    ::-webkit-scrollbar { display: none; }

    /* ===== ヘッダー（ダークネイビー） ===== */
    .app-header {
      background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%);
    }
    .header-title { letter-spacing: 0.02em; }

    /* ===== 支部チップ（控えめ） ===== */
    .chip {
      display:flex; align-items:center; gap:5px;
      padding:5px 11px; border-radius:9999px; font-size:12px; font-weight:600;
      background: rgba(255,255,255,0.08); color:#cbd5e1;
      border:1px solid rgba(255,255,255,0.12); transition:all 0.15s;
    }
    .chip .dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .chip.off { opacity:0.4; }
    .chip.off .dot { background:#64748b !important; }
    .dot-中央支部 { background:#a855f7; }
    .dot-東支部   { background:#22c55e; }
    .dot-西支部   { background:#eab308; }
    .dot-南支部   { background:#f97316; }
    .dot-北支部   { background:#3b82f6; }

    /* ===== 検索バー ===== */
    .search-box {
      background: rgba(255,255,255,0.1); color:#fff;
      border:1px solid rgba(255,255,255,0.14);
    }
    .search-box::placeholder { color:#94a3b8; }
    .search-box:focus { background: rgba(255,255,255,0.16); border-color:rgba(255,255,255,0.3); }

    /* ===== カードステータス ===== */
    .card { transition: opacity 0.15s; border-left: 4px solid transparent; }
    .card.status-予定  { border-left-color: #3b82f6; }
    .card.status-済み  { border-left-color: #22c55e; opacity: 0.55; }
    .card.status-済み .company-name { text-decoration: line-through; color: #94a3b8; }
    .card.status-なし  { border-left-color: #cbd5e1; opacity: 0.35; }
    .card.status-なし .company-name { color: #94a3b8; }

    /* ===== 支部バッジ ===== */
    .badge-中央支部 { background:#f3e8ff; color:#7e22ce; }
    .badge-東支部   { background:#dcfce7; color:#15803d; }
    .badge-西支部   { background:#fef9c3; color:#854d0e; }
    .badge-南支部   { background:#ffedd5; color:#c2410c; }
    .badge-北支部   { background:#dbeafe; color:#1d4ed8; }

    /* ===== ステータスバッジ ===== */
    .sbadge-予定 { background:#dbeafe; color:#1d4ed8; }
    .sbadge-済み { background:#dcfce7; color:#15803d; }
    .sbadge-なし { background:#f1f5f9; color:#94a3b8; }

    /* ===== タブ ===== */
    .tab-btn { flex:1; padding:11px 4px; font-size:12px; font-weight:700;
               border-bottom:2.5px solid transparent; color:#94a3b8; transition:all 0.15s; }
    .tab-btn.active { color:#0f172a; border-bottom-color:#0f172a; }

    /* ===== ステータスポップアップ ===== */
    #status-popup { display:none; position:fixed; z-index:60;
                    background:white; border-radius:16px; padding:8px;
                    box-shadow:0 8px 32px rgba(0,0,0,0.18); min-width:160px; }
    #status-popup.open { display:block; }
    .sp-btn { display:flex; align-items:center; gap:10px; width:100%;
              padding:10px 14px; border-radius:10px; font-size:14px; font-weight:600; }
    .sp-btn:active { background:#f1f5f9; }
    .sp-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

    /* ===== モーダル ===== */
    #memo-modal { display:none; }
    #memo-modal.open { display:flex; }

    /* ===== ドロワーメニュー ===== */
    #drawer-overlay { display:none; position:fixed; inset:0; z-index:70;
                      background:rgba(15,23,42,0.5); backdrop-filter:blur(2px); }
    #drawer-overlay.open { display:block; }
    #drawer {
      position:fixed; top:0; right:0; bottom:0; z-index:80; width:82%; max-width:340px;
      background:#fff; box-shadow:-8px 0 32px rgba(0,0,0,0.2);
      transform:translateX(100%); transition:transform 0.25s ease;
      display:flex; flex-direction:column;
    }
    #drawer.open { transform:translateX(0); }
    .drawer-head { background: linear-gradient(160deg, #1e293b 0%, #0f172a 100%); color:#fff; padding:22px 20px 18px; }
    .menu-item { display:flex; align-items:center; gap:14px; padding:15px 20px;
                 border-bottom:1px solid #f1f5f9; font-size:15px; font-weight:600; color:#1e293b; }
    .menu-item:active { background:#f8fafc; }
    .menu-item .mi-icon { width:38px; height:38px; border-radius:10px; display:flex;
                          align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
    .menu-item .mi-sub { font-size:11px; font-weight:500; color:#94a3b8; margin-top:1px; }

    /* ===== ボタン（落ち着いた配色） ===== */
    .btn-call { background:#059669; } .btn-call:active { background:#047857; }
    .btn-nav  { background:#475569; } .btn-nav:active  { background:#334155; }
    .btn-info { background:#1e293b; } .btn-info:active { background:#0f172a; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans select-none">

<!-- ===== ヘッダー ===== -->
<div class="app-header text-white sticky top-0 z-30 shadow-xl">
  <div class="max-w-lg mx-auto px-4 pt-3 pb-3">

    <!-- タイトル行 -->
    <div class="flex items-center justify-between mb-3">
      <div class="flex items-center gap-2">
        <span class="text-xl">🏢</span>
        <div>
          <h1 class="header-title text-base font-bold leading-tight">札幌業者ナビ</h1>
          <p class="text-[10px] text-slate-400 leading-tight" id="updated">読み込み中...</p>
        </div>
      </div>
      <button onclick="openDrawer()" aria-label="メニュー"
        class="w-9 h-9 flex items-center justify-center rounded-lg active:bg-white/10">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <!-- 支部フィルター -->
    <div class="flex gap-1.5 mb-2.5 overflow-x-auto">
      <button onclick="toggleSibu('中央支部')" id="btn-中央支部" class="chip"><span class="dot dot-中央支部"></span>中央</button>
      <button onclick="toggleSibu('東支部')"   id="btn-東支部"   class="chip"><span class="dot dot-東支部"></span>東</button>
      <button onclick="toggleSibu('西支部')"   id="btn-西支部"   class="chip"><span class="dot dot-西支部"></span>西</button>
      <button onclick="toggleSibu('南支部')"   id="btn-南支部"   class="chip"><span class="dot dot-南支部"></span>南</button>
      <button onclick="toggleSibu('北支部')"   id="btn-北支部"   class="chip"><span class="dot dot-北支部"></span>北</button>
    </div>

    <!-- 検索 -->
    <div class="relative">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" id="search" placeholder="社名・住所・宅建番号で検索"
        autocomplete="off" oninput="renderList()"
        class="search-box w-full pl-9 pr-3 py-2.5 rounded-xl text-sm focus:outline-none">
    </div>

    <!-- カウンター -->
    <div class="mt-2 text-xs text-slate-400" id="counter">　</div>
  </div>

  <!-- ===== ステータスタブ ===== -->
  <div class="flex bg-white max-w-lg mx-auto">
    <button class="tab-btn active" id="tab-全て"   onclick="switchTab('全て')">全て</button>
    <button class="tab-btn"        id="tab-予定"   onclick="switchTab('予定')">📋 訪問予定</button>
    <button class="tab-btn"        id="tab-済み"   onclick="switchTab('済み')">✅ 訪問済み</button>
    <button class="tab-btn"        id="tab-なし"   onclick="switchTab('なし')">🚫 訪問しない</button>
  </div>
</div>

<!-- ===== ドロワーメニュー ===== -->
<div id="drawer-overlay" onclick="closeDrawer()"></div>
<div id="drawer">
  <div class="drawer-head">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏢</span>
        <div>
          <p class="font-bold text-base leading-tight">札幌業者ナビ</p>
          <p class="text-[11px] text-slate-400" id="drawer-stats">　</p>
        </div>
      </div>
      <button onclick="closeDrawer()" class="text-slate-300 text-2xl leading-none w-8 h-8">&times;</button>
    </div>
  </div>

  <div class="overflow-y-auto flex-1">
    <button class="menu-item w-full text-left" onclick="closeDrawer();switchTab('予定')">
      <span class="mi-icon" style="background:#dbeafe">📋</span>
      <div><div>訪問予定の一覧</div><div class="mi-sub" id="mi-yotei">0件</div></div>
    </button>
    <button class="menu-item w-full text-left" onclick="closeDrawer();switchTab('済み')">
      <span class="mi-icon" style="background:#dcfce7">✅</span>
      <div><div>訪問済みの一覧</div><div class="mi-sub" id="mi-sumi">0件</div></div>
    </button>
    <button class="menu-item w-full text-left" onclick="closeDrawer();switchTab('なし')">
      <span class="mi-icon" style="background:#f1f5f9">🚫</span>
      <div><div>訪問しない一覧</div><div class="mi-sub" id="mi-nashi">0件</div></div>
    </button>
    <button class="menu-item w-full text-left" onclick="closeDrawer();switchTab('全て')">
      <span class="mi-icon" style="background:#e0e7ff">🗂️</span>
      <div><div>すべて表示</div><div class="mi-sub" id="mi-all">全件</div></div>
    </button>
    <button class="menu-item w-full text-left" onclick="allSibu(true)">
      <span class="mi-icon" style="background:#f0fdf4">☑️</span>
      <div><div>全支部を表示</div><div class="mi-sub">5支部すべてON</div></div>
    </button>
    <button class="menu-item w-full text-left" onclick="reloadData()">
      <span class="mi-icon" style="background:#fef9c3">🔄</span>
      <div><div>データを再読み込み</div><div class="mi-sub" id="mi-updated">最新データを取得</div></div>
    </button>
    <button class="menu-item w-full text-left" onclick="closeDrawer();confirmReset()">
      <span class="mi-icon" style="background:#fee2e2">🗑️</span>
      <div><div>訪問記録をリセット</div><div class="mi-sub">ステータス・メモを全消去</div></div>
    </button>
  </div>

  <div class="px-5 py-4 text-[11px] text-slate-400 border-t border-slate-100">
    データ更新は毎月1日に自動実行されます
  </div>
</div>

<!-- ===== リスト ===== -->
<div class="max-w-lg mx-auto px-3 py-3 space-y-3" id="list"></div>
<div id="empty" class="hidden text-center text-slate-400 mt-20 text-sm">該当する業者が見つかりません</div>

<!-- ===== ステータス選択ポップアップ ===== -->
<div id="status-popup">
  <button class="sp-btn" onclick="setStatus(null)">
    <span class="sp-dot" style="background:#e2e8f0;border:2px solid #cbd5e1"></span>
    <span class="text-slate-500">未設定に戻す</span>
  </button>
  <button class="sp-btn" onclick="setStatus('予定')">
    <span class="sp-dot" style="background:#3b82f6"></span>
    <span class="text-blue-700">📋 訪問予定</span>
  </button>
  <button class="sp-btn" onclick="setStatus('済み')">
    <span class="sp-dot" style="background:#22c55e"></span>
    <span class="text-green-700">✅ 訪問済み</span>
  </button>
  <button class="sp-btn" onclick="setStatus('なし')">
    <span class="sp-dot" style="background:#cbd5e1"></span>
    <span class="text-slate-400">🚫 訪問しない</span>
  </button>
</div>
<div id="popup-overlay" class="hidden fixed inset-0 z-50" onclick="closePopup()"></div>

<!-- ===== メモモーダル ===== -->
<div id="memo-modal" class="fixed inset-0 z-50 bg-black/60 items-end justify-center">
  <div class="bg-white w-full max-w-lg rounded-t-2xl p-5 pb-8 shadow-2xl">
    <div class="flex justify-between items-center mb-3">
      <h2 class="font-bold text-base" id="memo-title">メモ</h2>
      <button onclick="closeMemo()" class="text-slate-400 text-2xl leading-none">&times;</button>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-4">
      <label class="flex items-center gap-2 bg-slate-50 p-3 rounded-lg cursor-pointer">
        <input type="checkbox" id="memo-has-bukken" class="w-4 h-4 accent-blue-600">
        <span class="text-sm font-medium">物件あり</span>
      </label>
      <label class="flex items-center gap-2 bg-slate-50 p-3 rounded-lg cursor-pointer">
        <input type="checkbox" id="memo-needs-followup" class="w-4 h-4 accent-orange-500">
        <span class="text-sm font-medium">要フォロー</span>
      </label>
    </div>
    <label class="block text-xs text-slate-500 mb-1">担当者名</label>
    <input type="text" id="memo-person" placeholder="例：田中 課長"
      class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-blue-300">
    <label class="block text-xs text-slate-500 mb-1">メモ</label>
    <textarea id="memo-text" rows="3" placeholder="訪問内容・物件情報・次回アクション等"
      class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
    <button onclick="saveMemo()"
      class="w-full mt-4 bg-slate-800 text-white font-bold py-3 rounded-xl text-sm active:bg-slate-900">保存する</button>
  </div>
</div>

<script>
// ===== 状態 =====
let allData = [];
let sibuFilters = { '中央支部':true, '東支部':true, '西支部':true, '南支部':true, '北支部':true };
let currentTab  = '全て';   // '全て' | '予定' | '済み' | 'なし'
let currentMemoId  = null;
let currentPopupId = null;

// ===== LocalStorage =====
const LS_STATUS = 'status_v3';
const LS_MEMOS  = 'memos_v2';

function getStatuses() { try { return JSON.parse(localStorage.getItem(LS_STATUS)||'{}'); } catch{return{};} }
function getMemos()    { try { return JSON.parse(localStorage.getItem(LS_MEMOS) ||'{}'); } catch{return{};} }
function saveStatuses(s){ localStorage.setItem(LS_STATUS, JSON.stringify(s)); }
function saveMemos(m)   { localStorage.setItem(LS_MEMOS,  JSON.stringify(m)); }

// ===== データ読み込み =====
async function loadData() {
  try {
    const res  = await fetch('data.json?_='+Date.now());
    const json = await res.json();
    allData = json.companies || [];
    const upd = json.updated || '';
    document.getElementById('updated').textContent = '最終更新 ' + upd;
    document.getElementById('mi-updated').textContent = '最終更新: ' + upd;
    renderList();
  } catch(e) {
    document.getElementById('counter').textContent = 'data.jsonが見つかりません';
  }
}

// ===== データ再読み込み（メニューから） =====
async function reloadData() {
  document.getElementById('mi-updated').textContent = '読み込み中...';
  await loadData();
  closeDrawer();
}

// ===== ドロワー =====
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}
function allSibu(on) {
  Object.keys(sibuFilters).forEach(s => {
    sibuFilters[s] = on;
    const btn = document.getElementById('btn-'+s);
    if (btn) btn.classList.toggle('off', !on);
  });
  renderList();
  closeDrawer();
}

// ===== タブ切り替え =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  renderList();
}

// ===== 支部フィルター =====
function toggleSibu(sibu) {
  sibuFilters[sibu] = !sibuFilters[sibu];
  const btn = document.getElementById('btn-'+sibu);
  if (btn) btn.classList.toggle('off', !sibuFilters[sibu]);
  renderList();
}

// ===== リスト描画 =====
function renderList() {
  const q        = (document.getElementById('search').value||'').trim().toLowerCase();
  const statuses = getStatuses();
  const memos    = getMemos();

  // フィルタリング
  let list = allData.filter(c => {
    if (!sibuFilters[c.sibu]) return false;
    const st = statuses[c.id] || null;
    if (currentTab === '予定' && st !== '予定') return false;
    if (currentTab === '済み' && st !== '済み') return false;
    if (currentTab === 'なし' && st !== 'なし') return false;
    if (currentTab === '全て' && st === 'なし') return false; // 「全て」タブでは「訪問しない」を非表示
    if (!q) return true;
    return [c.name, c.address, c.takken_no, c.phone, c.representative]
      .some(v => (v||'').toLowerCase().includes(q));
  });

  // ソート: 予定 → 未設定 → 済み
  const order = { '予定':0, null:1, undefined:1, '済み':2 };
  list.sort((a,b) => (order[statuses[a.id]]??1) - (order[statuses[b.id]]??1));

  // カウンター
  const cnt = { '予定':0, '済み':0, 'なし':0 };
  allData.forEach(c => { const s=statuses[c.id]; if(s) cnt[s]=(cnt[s]||0)+1; });
  document.getElementById('counter').textContent =
    `${list.length}件を表示中　･　予定 ${cnt['予定']}　済 ${cnt['済み']}　対象外 ${cnt['なし']}`;

  // ドロワー内の件数も更新
  const setTxt = (id, v) => { const el=document.getElementById(id); if(el) el.textContent=v; };
  setTxt('mi-yotei', cnt['予定']+'件');
  setTxt('mi-sumi',  cnt['済み']+'件');
  setTxt('mi-nashi', cnt['なし']+'件');
  setTxt('mi-all',   '全'+allData.length+'件');
  setTxt('drawer-stats', '全'+allData.length+'件 登録');

  const listEl  = document.getElementById('list');
  const emptyEl = document.getElementById('empty');

  if (!list.length) { listEl.innerHTML=''; emptyEl.classList.remove('hidden'); return; }
  emptyEl.classList.add('hidden');

  listEl.innerHTML = list.map(c => {
    const st   = statuses[c.id] || null;
    const memo = memos[c.id] || {};

    // ステータスボタン表示
    const stBtn = st
      ? `<button onclick="openPopup(event,'${c.id}')"
           class="flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold sbadge-${st} border border-current/20 whitespace-nowrap">
           ${{予定:'📋 訪問予定', 済み:'✅ 訪問済み', なし:'🚫 訪問しない'}[st]}
         </button>`
      : `<button onclick="openPopup(event,'${c.id}')"
           class="flex-shrink-0 px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-400 border border-slate-200 whitespace-nowrap">
           ＋ ステータス
         </button>`;

    // メモタグ
    const tags = [
      memo.has_bukken    ? '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full text-xs">物件あり</span>' : '',
      memo.needs_followup? '<span class="bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full text-xs">要フォロー</span>' : '',
      memo.person        ? `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-xs">👤 ${escHtml(memo.person)}</span>` : '',
    ].filter(Boolean).join('');

    const memoText = memo.text
      ? `<p class="text-xs text-slate-500 mt-1 line-clamp-2">📝 ${escHtml(memo.text)}</p>` : '';

    return `
    <div class="card bg-white rounded-xl shadow-sm overflow-hidden ${st?'status-'+st:''}" id="card-${c.id}">
      <div class="p-4">
        <div class="flex items-start justify-between gap-2">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5 mb-0.5 flex-wrap">
              <span class="text-xs px-2 py-0.5 rounded-full font-bold badge-${c.sibu}">${c.sibu}</span>
            </div>
            <h2 class="company-name font-bold text-base leading-snug">${escHtml(c.name)}</h2>
          </div>
          ${stBtn}
        </div>
        <div class="mt-2 space-y-1 text-sm text-slate-600">
          <p>📍 ${escHtml(c.address)}</p>
          ${c.phone ? `<p>📞 ${escHtml(c.phone)}</p>` : ''}
          ${c.takken_no ? `<p class="text-xs text-slate-400">🏛️ ${escHtml(c.takken_no)}</p>` : ''}
          ${c.representative ? `<p class="text-xs text-slate-400">👤 代表: ${escHtml(c.representative)}</p>` : ''}
        </div>
        ${tags ? `<div class="flex flex-wrap gap-1 mt-2">${tags}</div>` : ''}
        ${memoText}
      </div>

      <div class="grid grid-cols-3 border-t border-slate-100">
        ${c.phone
          ? `<button onclick="callPhone('${escHtml(c.phone)}')" class="btn-call text-white py-3 text-sm font-bold flex items-center justify-center">📞 電話</button>`
          : `<div class="bg-slate-50 py-3"></div>`}
        <button onclick="openNav('${escHtml(c.address)}')" class="btn-nav text-white py-3 text-sm font-bold flex items-center justify-center">🗺️ ナビ</button>
        <button onclick="openMemo('${c.id}','${escHtml(c.name)}')" class="btn-info text-white py-3 text-sm font-bold flex items-center justify-center">✏️ メモ</button>
      </div>

      ${c.hp ? `
      <div class="px-4 pb-3 pt-1 text-xs border-t border-slate-50">
        <p><a href="${escHtml(c.hp)}" target="_blank" class="text-blue-500 underline break-all">${escHtml(c.hp)}</a></p>
      </div>` : ''}
    </div>`;
  }).join('');
}

// ===== ステータスポップアップ =====
function openPopup(e, id) {
  e.stopPropagation();
  currentPopupId = id;
  const popup = document.getElementById('status-popup');
  const rect  = e.currentTarget.getBoundingClientRect();
  popup.style.top  = (rect.bottom + window.scrollY + 6) + 'px';
  // 画面右端に収まるよう調整
  const left = Math.min(rect.left, window.innerWidth - 180);
  popup.style.left = left + 'px';
  popup.classList.add('open');
  document.getElementById('popup-overlay').classList.remove('hidden');
}
function closePopup() {
  document.getElementById('status-popup').classList.remove('open');
  document.getElementById('popup-overlay').classList.add('hidden');
  currentPopupId = null;
}
function setStatus(st) {
  if (!currentPopupId) return;
  const statuses = getStatuses();
  if (st === null) delete statuses[currentPopupId];
  else statuses[currentPopupId] = st;
  saveStatuses(statuses);
  closePopup();
  renderList();
}

// ===== アクション =====
function callPhone(phone) { window.location.href = 'tel:' + phone.replace(/[^0-9+]/g,''); }
function openNav(address)  { window.open('https://maps.google.com/?q='+encodeURIComponent(address)+'&dirflg=d','_blank'); }

function confirmReset() {
  if (confirm('全ての訪問ステータス・メモをリセットしますか？\nこの操作は元に戻せません。')) {
    localStorage.removeItem(LS_STATUS);
    localStorage.removeItem(LS_MEMOS);
    renderList();
  }
}

// ===== メモ =====
function openMemo(id, name) {
  currentMemoId = id;
  const m = getMemos()[id] || {};
  document.getElementById('memo-title').textContent = name;
  document.getElementById('memo-has-bukken').checked    = !!m.has_bukken;
  document.getElementById('memo-needs-followup').checked= !!m.needs_followup;
  document.getElementById('memo-person').value = m.person||'';
  document.getElementById('memo-text').value   = m.text||'';
  document.getElementById('memo-modal').classList.add('open');
  setTimeout(()=>document.getElementById('memo-person').focus(), 100);
}
function closeMemo() {
  document.getElementById('memo-modal').classList.remove('open');
  currentMemoId = null;
}
function saveMemo() {
  if (!currentMemoId) return;
  const memos = getMemos();
  memos[currentMemoId] = {
    has_bukken:     document.getElementById('memo-has-bukken').checked,
    needs_followup: document.getElementById('memo-needs-followup').checked,
    person: document.getElementById('memo-person').value.trim(),
    text:   document.getElementById('memo-text').value.trim(),
  };
  saveMemos(memos);
  closeMemo();
  renderList();
}
document.getElementById('memo-modal').addEventListener('click', function(e){ if(e.target===this) closeMemo(); });

// ===== ユーティリティ =====
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

loadData();
</script>
